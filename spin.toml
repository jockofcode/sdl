[package]
name        = "sdl"
version     = "0.1.0"
description = "SDL3 graphics bindings for Spinel"
authors     = ["Branden Giacoletto"]

# published repos are conventionally named spinel-sdl

# Static SDL3 + SDL3_ttf, built from source at spin-build time (not fetched
# as prebuilt binaries) so this file never hardcodes a path to wherever
# they happen to live on whatever machine runs `spin build` — fully
# machine-independent, at the cost of a slow first build (full source clone
# + CMake compile of SDL3, then SDL3_ttf/FreeType/HarfBuzz). Cached by
# content hash after that (see spin's `[[build]]` docs), BUT all three
# entries below share ONE cache key across the whole package ("one artifact
# dir per package, keyed over every entry's inputs" — tools/spin.rb), so
# editing shim.c (entry 3) busts the cache for entries 1+2 too, forcing a
# full SDL3+SDL3_ttf rebuild from source again even though their own inputs
# didn't change. Worth knowing before iterating on shim.c.
#
# Entry 1: SDL3 itself. See sdl/native/sdl3/build.sh for the full recipe;
# produces libSDL3.a (linked directly below) and a tarball of the complete
# install tree (headers + lib + CMake package config) for entry 2 to build
# against.
[[build]]
workdir   = "sdl/native/sdl3"
command   = "sh build.sh"
artifacts = ["libSDL3.a", "sdl3-install.tar"]

# Entry 2: SDL3_ttf (with vendored FreeType/HarfBuzz), built against entry
# 1's install tree. See sdl/native/sdl3_ttf/build.sh. Produces libSDL3_ttf.a
# plus the two vendored static libs (CMake's install step doesn't install
# those, so the script pulls them straight out of its own build tree) and a
# tarball of just the headers, for entry 3 to compile the shim against.
[[build]]
workdir   = "sdl/native/sdl3_ttf"
command   = "sh build.sh ${build.out}/sdl3-install.tar"
artifacts = ["libSDL3_ttf.a", "libfreetype.a", "libharfbuzz.a", "sdl3ttf-headers.tar"]

# Entry 3: SDL3_image (with vendored libpng/zlib/libjpeg — PNG + JPEG
# decoding only, see sdl/native/sdl3_image/build.sh for why other formats
# are off), built against entry 1's install tree. Every static archive the
# vendored build produces (SDL3_image itself plus its deps) is merged into
# one bundle by the build script rather than named individually, since the
# vendored dep target names aren't confirmed from this environment and a
# wrong guess would fail the whole from-source rebuild.
[[build]]
workdir   = "sdl/native/sdl3_image"
command   = "sh build.sh ${build.out}/sdl3-install.tar"
artifacts = ["libSDL3_image_bundle.a", "sdl3image-headers.tar"]

# Entry 4: the FFI shim (sdl/shim.c), compiled against headers extracted
# from entries 1+2+3's tarballs. See sdl/build_shim.sh.
[[build]]
workdir   = "sdl"
command   = "sh build_shim.sh ${build.out}/sdl3-install.tar ${build.out}/sdl3ttf-headers.tar ${build.out}/sdl3image-headers.tar"
artifacts = ["libsdl_shim.a"]

# Entry 5: the system libraries SDL3/SDL3_ttf need in place of their own
# dylib/.so load commands (a static .a carries no load-command metadata).
# spin.toml has no per-platform conditional, and every [[build]] entry runs
# unconditionally on whichever host is doing the build -- so this ALWAYS
# runs, on macOS or Linux alike, and always produces the full artifact list
# below; sdl/native/system_libs/build.sh fills in the real content only for
# whichever names match the current host (via `uname`) and a harmless
# empty-archive placeholder for the rest, which every linker just ignores.
# See that script for the full explanation, and how the macOS framework
# list and the Linux system-lib list (system_libs.ld) were each derived.
[[build]]
workdir   = "sdl/native/system_libs"
command   = "sh build.sh ${build.out}/sdl3-install.tar"
artifacts = ["CoreText.tbd", "CoreGraphics.tbd", "CoreFoundation.tbd", "libobjc.tbd", "libpthread.tbd", "CoreMedia.tbd", "CoreVideo.tbd", "Cocoa.tbd", "UniformTypeIdentifiers.tbd", "IOKit.tbd", "ForceFeedback.tbd", "Carbon.tbd", "CoreAudio.tbd", "AudioToolbox.tbd", "AVFoundation.tbd", "Foundation.tbd", "GameController.tbd", "Metal.tbd", "QuartzCore.tbd", "CoreHaptics.tbd", "system_libs.ld"]

[native]
# spin's TOML reader parses line-by-line and has no array continuation, so
# this must stay a single line despite the length. Every ${build.out}/*.tbd
# entry below is entry 5's output (real Xcode framework stub on macOS,
# harmless placeholder on Linux); system_libs.ld is the reverse (real GNU-ld
# script bundling X11/audio/etc on Linux, harmless placeholder on macOS).
libs = ["${build.out}/libsdl_shim.a", "${build.out}/libSDL3_ttf.a", "${build.out}/libharfbuzz.a", "${build.out}/libfreetype.a", "${build.out}/libSDL3_image_bundle.a", "${build.out}/libSDL3.a", "${build.out}/CoreText.tbd", "${build.out}/CoreGraphics.tbd", "${build.out}/CoreFoundation.tbd", "${build.out}/libobjc.tbd", "${build.out}/libpthread.tbd", "${build.out}/CoreMedia.tbd", "${build.out}/CoreVideo.tbd", "${build.out}/Cocoa.tbd", "${build.out}/UniformTypeIdentifiers.tbd", "${build.out}/IOKit.tbd", "${build.out}/ForceFeedback.tbd", "${build.out}/Carbon.tbd", "${build.out}/CoreAudio.tbd", "${build.out}/AudioToolbox.tbd", "${build.out}/AVFoundation.tbd", "${build.out}/Foundation.tbd", "${build.out}/GameController.tbd", "${build.out}/Metal.tbd", "${build.out}/QuartzCore.tbd", "${build.out}/CoreHaptics.tbd", "${build.out}/system_libs.ld"]

[dependencies]
public_sans = { git = "https://github.com/uswds/public-sans" }
vt323 = { git = "https://github.com/phoikoi/VT323" }
jetbrains_mono = { git = "https://github.com/JetBrains/JetBrainsMono" }
