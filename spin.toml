[package]
name        = "sdl"
version     = "0.1.0"
description = "SDL3 graphics bindings for Spinel"
authors     = ["Branden Giacoletto"]

# published repos are conventionally named spinel-sdl

# Static SDL3 + SDL3_ttf, built from source at spin-build time (not fetched
# as prebuilt binaries) so this file never hardcodes a path to wherever
# they happen to live on whatever machine runs `spin build` — fully
# machine-independent, at the cost of a slow first build (full source clone
# + CMake compile of SDL3, then SDL3_ttf/FreeType/HarfBuzz). Cached by
# content hash after that (see spin's `[[build]]` docs), BUT all three
# entries below share ONE cache key across the whole package ("one artifact
# dir per package, keyed over every entry's inputs" — tools/spin.rb), so
# editing shim.c (entry 3) busts the cache for entries 1+2 too, forcing a
# full SDL3+SDL3_ttf rebuild from source again even though their own inputs
# didn't change. Worth knowing before iterating on shim.c.
#
# Entry 1: SDL3 itself. See sdl/native/sdl3/build.sh for the full recipe;
# produces libSDL3.a (linked directly below) and a tarball of the complete
# install tree (headers + lib + CMake package config) for entry 2 to build
# against.
[[build]]
workdir   = "sdl/native/sdl3"
command   = "sh build.sh"
artifacts = ["libSDL3.a", "sdl3-install.tar"]

# Entry 2: SDL3_ttf (with vendored FreeType/HarfBuzz), built against entry
# 1's install tree. See sdl/native/sdl3_ttf/build.sh. Produces libSDL3_ttf.a
# plus the two vendored static libs (CMake's install step doesn't install
# those, so the script pulls them straight out of its own build tree) and a
# tarball of just the headers, for entry 3 to compile the shim against.
[[build]]
workdir   = "sdl/native/sdl3_ttf"
command   = "sh build.sh ${build.out}/sdl3-install.tar"
artifacts = ["libSDL3_ttf.a", "libfreetype.a", "libharfbuzz.a", "sdl3ttf-headers.tar"]

# Entry 3: the FFI shim (sdl/shim.c), compiled against headers extracted
# from entries 1+2's tarballs. See sdl/build_shim.sh.
[[build]]
workdir   = "sdl"
command   = "sh build_shim.sh ${build.out}/sdl3-install.tar ${build.out}/sdl3ttf-headers.tar"
artifacts = ["libsdl_shim.a"]

# The system frameworks SDL3/SDL3_ttf need, in place of their own dylib load
# commands (a static .a carries no load-command metadata, unlike a dylib).
# Framework/libobjc/libpthread entries point at the SDK's .tbd stubs since
# the real dylibs no longer live on disk under /System or /usr/lib (they
# ship only in the dyld shared cache) — .tbd files are real files on disk
# that `cc`/`ld` link against exactly like the framework binary itself.
# These paths live under Xcode's install location, not a per-user one, so
# they're the same on every Mac with Xcode installed at its default
# location — not a "hardcoded machine path" in the sense the other entries
# in this file used to be. Full SDL3 framework list came from
# sdl3.pc's Libs line (SDL3 has no sdl3-config — CMake doesn't generate
# that autotools-style script) from an earlier prebuilt install; the extra
# CoreText/CoreGraphics/CoreFoundation entries came from sdl3-ttf.pc's
# Libs.private line likewise.
[native]
# spin's TOML reader parses line-by-line and has no array continuation, so
# this must stay a single line despite the length.
libs = ["${build.out}/libsdl_shim.a", "${build.out}/libSDL3_ttf.a", "${build.out}/libharfbuzz.a", "${build.out}/libfreetype.a", "${build.out}/libSDL3.a", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/CoreText.framework/CoreText.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/CoreGraphics.framework/CoreGraphics.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/CoreFoundation.framework/CoreFoundation.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/lib/libobjc.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/lib/libpthread.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/CoreMedia.framework/CoreMedia.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/CoreVideo.framework/CoreVideo.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/Cocoa.framework/Cocoa.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/UniformTypeIdentifiers.framework/UniformTypeIdentifiers.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/IOKit.framework/IOKit.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/ForceFeedback.framework/ForceFeedback.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/Carbon.framework/Carbon.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/CoreAudio.framework/CoreAudio.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/AudioToolbox.framework/AudioToolbox.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/AVFoundation.framework/AVFoundation.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/Foundation.framework/Foundation.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/GameController.framework/GameController.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/Metal.framework/Metal.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/QuartzCore.framework/QuartzCore.tbd", "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/CoreHaptics.framework/CoreHaptics.tbd"]

[dependencies]
public_sans = { git = "https://github.com/uswds/public-sans" }
vt323 = { git = "https://github.com/phoikoi/VT323" }
jetbrains_mono = { git = "https://github.com/JetBrains/JetBrainsMono" }
